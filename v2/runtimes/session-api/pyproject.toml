[project]
name = "tha-session-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "talkinghead-v2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "livekit>=1.0,<2",
  "livekit-api>=1.0,<2",
  "faster-whisper>=1.2,<2",
  "webrtcvad-wheels>=2.0,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1,<2"]

[tool.uv.sources]
talkinghead-v2 = {path = "../..", editable = true}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
